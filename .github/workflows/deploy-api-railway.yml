name: Deploy API to Railway

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "railway.json"
      - "apps/api/**"
      - ".github/workflows/deploy-api-railway.yml"
  workflow_dispatch:

concurrency:
  group: railway-api-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test API
        run: npm --workspace @condo-clean/api test

      - name: Check API build
        run: npm --workspace @condo-clean/api run build

  deploy:
    name: Deploy API
    needs: validate
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 72c29bb4-f05e-4b2f-9d03-87d25b5114d7
      RAILWAY_ENVIRONMENT: production
      RAILWAY_SERVICE: api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Check Railway credentials
        id: railway
        shell: bash
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Railway deploy skipped::GitHub secret RAILWAY_TOKEN is missing. API validation passed, but no deployment was attempted."
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Install Railway CLI
        if: steps.railway.outputs.enabled == 'true'
        run: npm install -g @railway/cli

      - name: Deploy API to Railway
        if: steps.railway.outputs.enabled == 'true'
        shell: bash
        run: |
          set +e
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_SERVICE" \
            --ci \
            --message "GitHub auto deploy ${GITHUB_SHA}" 2>&1 | tee railway-deploy.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ] && grep -qi "Unauthorized" railway-deploy.log; then
            echo "GitHub secret RAILWAY_TOKEN is present, but Railway rejected it."
            echo "Create a valid Railway Project Token for trustworthy-nourishment / production and update the GitHub secret RAILWAY_TOKEN."
            exit 1
          fi

          exit "$status"
